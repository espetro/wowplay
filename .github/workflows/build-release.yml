name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name==\"${{ github.ref_name }}\") | .id"); do
            echo "Deleting stale release $id for ${{ github.ref_name }}"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: brew install zig

      - name: Build wowplay
        run: cargo build --release --target aarch64-apple-darwin -p wowplay

      - name: Build winerosetta.dll
        run: zig build --release=safe
        working-directory: packages/zig-glue

      - name: Build rosettax87_jit
        run: |
          cmake \
            -B vendor/rosettax87_jit/build \
            -S vendor/rosettax87_jit \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev \
            --log-level=WARNING
          cmake --build vendor/rosettax87_jit/build --config Release

      - name: Stage release bundle
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/wowplay dist/wowplay
          bash scripts/stage-patching.sh

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Sign inner binaries (rosettax87 pair)
        run: |
          IDENTITY="Developer ID Application: Joaquin Terrasa Moya (Y3ZC4LB357)"
          ENTITLEMENTS="packages/gui/Rosettax87.entitlements"
          # Sign libRuntimeRosettax87 first (dependency), then rosettax87.
          codesign \
            --sign "$IDENTITY" \
            --options runtime --timestamp --force \
            --entitlements "$ENTITLEMENTS" \
            dist/patching/rosettax87/libRuntimeRosettax87
          codesign --verify --verbose dist/patching/rosettax87/libRuntimeRosettax87
          codesign \
            --sign "$IDENTITY" \
            --options runtime --timestamp --force \
            --entitlements "$ENTITLEMENTS" \
            dist/patching/rosettax87/rosettax87
          codesign --verify --verbose dist/patching/rosettax87/rosettax87

      - name: Sign binary
        run: |
          codesign \
            --sign "Developer ID Application: Joaquin Terrasa Moya (Y3ZC4LB357)" \
            --options runtime \
            --timestamp \
            --force \
            dist/wowplay
          codesign --verify --verbose dist/wowplay

      - name: Create zip
        run: cd dist && zip -r ../wowplay-${{ github.ref_name }}-macos-arm64.zip .

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          SUBMISSION=$(xcrun notarytool submit wowplay-${{ github.ref_name }}-macos-arm64.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json)
          echo "$SUBMISSION"
          STATUS=$(echo "$SUBMISSION" | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "Notarization status: $STATUS — aborting build"
            exit 1
          fi
          echo "Notarization accepted."

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" wowplay-${{ github.ref_name }}-macos-arm64.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gui:
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: oven-sh/setup-bun@v1

      - run: brew install zig

      - name: Install JS dependencies
        run: bun install

      - name: Build winerosetta.dll
        run: zig build --release=safe
        working-directory: packages/zig-glue

      - name: Build rosettax87_jit
        run: |
          cmake \
            -B vendor/rosettax87_jit/build \
            -S vendor/rosettax87_jit \
            -DCMAKE_BUILD_TYPE=Release \
            -Wno-dev \
            --log-level=WARNING
          cmake --build vendor/rosettax87_jit/build --config Release

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Build GUI
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Joaquin Terrasa Moya (Y3ZC4LB357)"
        run: |
          cd packages/gui
          bunx tauri build --target aarch64-apple-darwin --bundles app

      - name: Sign inner binaries and re-seal app bundle
        run: |
          IDENTITY="Developer ID Application: Joaquin Terrasa Moya (Y3ZC4LB357)"
          ENTITLEMENTS="packages/gui/Rosettax87.entitlements"
          APP=$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"

          # Sign Mach-O binaries in Resources/patching/ (innermost first)
          codesign --sign "$IDENTITY" --options runtime --timestamp --force \
            --entitlements "$ENTITLEMENTS" \
            "$APP/Contents/Resources/patching/rosettax87/libRuntimeRosettax87"
          codesign --verify --verbose "$APP/Contents/Resources/patching/rosettax87/libRuntimeRosettax87"

          codesign --sign "$IDENTITY" --options runtime --timestamp --force \
            --entitlements "$ENTITLEMENTS" \
            "$APP/Contents/Resources/patching/rosettax87/rosettax87"
          codesign --verify --verbose "$APP/Contents/Resources/patching/rosettax87/rosettax87"

          # Re-seal the bundle after modifying its contents (preserves Tauri entitlements)
          codesign --sign "$IDENTITY" --options runtime --timestamp --force \
            --entitlements "packages/gui/Entitlements.plist" \
            "$APP"
          codesign --verify --verbose "$APP"

      - name: Create and sign DMG
        run: |
          IDENTITY="Developer ID Application: Joaquin Terrasa Moya (Y3ZC4LB357)"
          APP=$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          DMG_PATH="wowplay-${{ github.ref_name }}-macos-arm64.dmg"

          mkdir -p dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications

          hdiutil create \
            -volname "WoW on Silicon" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          codesign --sign "$IDENTITY" --timestamp "$DMG_PATH"
          echo "DMG created and signed: $DMG_PATH"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG_PATH="wowplay-${{ github.ref_name }}-macos-arm64.dmg"
          echo "Notarizing $DMG_PATH"
          SUBMISSION=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json)
          echo "$SUBMISSION"
          STATUS=$(echo "$SUBMISSION" | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"])')
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "DMG notarization status: $STATUS — aborting build"
            exit 1
          fi
          echo "Notarization accepted."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload DMG to release
        run: |
          DMG_PATH="wowplay-${{ github.ref_name }}-macos-arm64.dmg"
          echo "Uploading $DMG_PATH"
          gh release upload "${{ github.ref_name }}" "$DMG_PATH" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
