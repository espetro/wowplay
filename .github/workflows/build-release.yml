name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name==\"${{ github.ref_name }}\") | .id"); do
            echo "Deleting stale release $id for ${{ github.ref_name }}"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: brew install zig

      - name: Build wowplay
        run: cargo build --release --target aarch64-apple-darwin -p wowplay

      - name: Build winerosetta.dll
        run: zig build --release=safe
        working-directory: packages/zig-glue

      - name: Stage release bundle
        run: |
          mkdir -p dist/patching
          cp target/aarch64-apple-darwin/release/wowplay dist/wowplay
          cp -R vendor/wowsilicon/Sources/WoWSiliconSwift/Resources/Patching/. dist/patching/
          cp packages/zig-glue/zig-out/bin/winerosetta.dll dist/patching/winerosetta/winerosetta.dll

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Sign binary
        run: |
          codesign \
            --sign "Developer ID Application: Joaquin Terrasa Moya (Y3ZC4LB357)" \
            --options runtime \
            --timestamp \
            --force \
            dist/wowplay
          codesign --verify --verbose dist/wowplay

      - name: Create zip
        run: cd dist && zip -r ../wowplay-${{ github.ref_name }}-macos-arm64.zip .

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit wowplay-${{ github.ref_name }}-macos-arm64.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Upload to release
        run: gh release upload "${{ github.ref_name }}" wowplay-${{ github.ref_name }}-macos-arm64.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-gui:
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: oven-sh/setup-bun@v1

      - name: Install JS dependencies
        run: bun install

      - name: Build wowplay sidecar
        run: |
          cargo build --release --target aarch64-apple-darwin -p wowplay
          mkdir -p packages/gui/binaries
          cp target/aarch64-apple-darwin/release/wowplay packages/gui/binaries/wowplay-aarch64-apple-darwin

      - name: Build GUI
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Joaquin Terrasa Moya (Y3ZC4LB357)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd packages/gui
          bunx tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload DMG to release
        run: |
          DMG=$(find target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          echo "Found DMG: $DMG"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
