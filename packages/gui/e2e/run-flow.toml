name = "run-flow"

[[steps]]
action = "click"
selector = "[data-testid='runner-select-trigger']"

[[steps]]
action = "click"
selector = "[data-value='crossover']"

[[steps]]
action = "ipc"
command = "validate_wow_dir"
args = { path = "/tmp/test-wow" }

[[steps]]
action = "click"
selector = "[data-testid='action-btn']"

[[steps]]
action = "wait"
selector = "[data-testid='alert-info']"
args = { text = "Setup complete" }

[[steps]]
action = "click"
selector = "[data-testid='action-btn']"

[[steps]]
action = "assert"
selector = "[data-testid='alert-info']"
args = { contains = "WoW launched" }
