[workspace]
# All packages release together with synchronized versions
# Tag format: v0.2.0
tag_prefix = "v"
tag_name = "v{{version}}"

[workspace.package]
# release-plz derives next version from conventional commits
# and cargo-semver-checks for API breaking change detection
semver_check = true

[publish]
# No packages are published to crates.io
publish = false
