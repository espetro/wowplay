# WoW Profiling Configuration
# This file is committed to git with safe defaults.
# Copy to config.local.toml and override with your actual paths.

[paths]
# Path to WoW 3.3.5a client directory
wow_dir = "/Users/mykino/Documents/ChromieCraft_3.3.5a"

# Path to CrossOver.app
crossover_app = "/Users/mykino/Applications/CrossOver.app"

# Path to WoW.exe inside the client directory (relative to wow_dir)
wow_exe = "WoW.exe"

[profiling]
# Default profiling duration in seconds
default_duration = 300

# Minimum duration allowed (seconds)
min_duration = 10

# Maximum duration allowed (seconds)
max_duration = 3600

# Sample interval for CPU sampling (seconds)
cpu_sample_interval = 1

# Output directory for profiling data (relative to project root)
output_dir = "data/profiling"

[wow]
# WoW.exe memory range (updated after Spike A/T04)
# These are example values for 32-bit PE — update after memory map documentation
base_address = "0x00400000"
memory_range_start = "0x00400000"
memory_range_end = "0x00800000"

# WoW version being profiled
version = "3.3.5a"
build = "12340"

[jit_profile]
# Path where rosettax87_jit writes opcode counts when ROSETTA_X87_PROFILE=1.
# Must match ROSETTA_X87_PROFILE_OUT set at WoW launch time.
profile_out = "/tmp/rosettax87_profile.json"

[sampling]
# Parse sample output for these modules (libSiliconPatch.dll is optional)
sample_modules = ["WoW.exe", "libSiliconPatch.dll"]
