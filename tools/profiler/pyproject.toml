[project]
name = "wow-silicon-profiler"
version = "0.3.0"
description = "Profiling harness for WoW 3.3.5a on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Joaquin Terrasa"},
]
keywords = ["wow", "profiling", "x87", "apple-silicon", "rosetta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "toml>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
wow-attach = "attach:main"
wow-ingest-jit = "ingest_jit_counts:main"
wow-sample-cpu = "sample_cpu:main"
wow-analyze = "analyze:main"

[tool.uv]
python-downloads = "automatic"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
